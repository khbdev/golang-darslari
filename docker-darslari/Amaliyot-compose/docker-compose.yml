version: "3.8"

services:
  amalyotapi:
    ports:
      - "8084:8084"
    depends_on:
      - mysql
      - redis
    networks:
      - app_network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: yangi_parol
      MYSQL_DATABASE: amalyotApi
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  redis:
    image: redis:alpine

    ports:
      - "6371:6379"
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
